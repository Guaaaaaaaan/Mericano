    <style>
        /* Base */
        body {
            background-color: var(--bg-light-cream);
            color: var(--text-main);
        }

        .text-secondary {
            color: var(--text-secondary) !important;
        }

        .border-top {
            border-top-color: var(--border-light) !important;
        }

        .card {
            border-color: var(--border-light);
            border-radius: 0.75rem;
        }

        /* Navbar */
        .sbx-navbar {
            background-color: var(--brand-primary);
        }

        .sbx-navbar .nav-link,
        .sbx-navbar .navbar-brand {
            color: var(--text-inverse);
        }

        .sbx-navbar .nav-link.active,
        .sbx-navbar .nav-link:hover {
            color: var(--text-inverse);
            opacity: 0.9;
        }

        /* Hero */
        .sbx-hero {
            background-color: var(--bg-light-cream);
        }

        /* Buttons */
        .sbx-cta-primary {
            background-color: var(--brand-primary);
            color: var(--text-inverse);
            border-color: var(--brand-primary);
            border-radius: 0.5rem;
        }

        .sbx-cta-primary:hover {
            background-color: var(--accent-caramel);
            border-color: var(--accent-caramel);
            color: var(--text-main);
        }

        .sbx-cta-outline {
            color: var(--brand-primary);
            border-color: var(--brand-primary);
            background-color: transparent;
            border-radius: 0.5rem;
        }

        .sbx-cta-outline:hover {
            background-color: rgba(107, 66, 38, 0.08);
            color: var(--brand-primary);
        }

        /* Accent utilities */
        .text-accent-olive {
            color: var(--accent-olive);
        }

        .text-accent-caramel {
            color: var(--accent-caramel);
        }

        /* Band */
        .sbx-band {
            background-color: var(--bg-dark-brown);
            color: var(--text-inverse);
        }

        /* Footer */
        .sbx-footer {
            background-color: var(--bg-dark-brown);
            color: var(--text-inverse);
        }

        .sbx-footer a {
            color: var(--text-inverse);
            text-decoration: none;
            opacity: 0.9;
        }

        .sbx-footer a:hover {
            color: var(--text-inverse);
            opacity: 1;
        }

        /* Custom styles for forms */
        .form-control {
            border-color: var(--border-light);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 0.25rem rgba(107, 66, 38, 0.25);
        }

        .form-check-input:checked {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
        }
    </style>
</head>

    <!-- Main Content Area - Login / Sign Up Form -->
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card p-4 shadow-lg">
                        <h1 class="h3 fw-bold text-center mb-4" data-i18n="auth.pageTitle">登录 / 注册</h1>

                        <!-- Login Form -->
                        <form id="loginForm" class="mb-4">
                            <h2 class="h5 fw-semibold mb-3" data-i18n="auth.loginTitle">登录</h2>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label" data-i18n="auth.emailLabel">邮箱地址</label>
                                <input type="email" class="form-control" id="loginEmail" aria-describedby="emailHelp"
                                    data-i18n-placeholder="auth.emailPlaceholder" placeholder="您的邮箱">
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label" data-i18n="auth.passwordLabel">密码</label>
                                <input type="password" class="form-control" id="loginPassword"
                                    data-i18n-placeholder="auth.passwordPlaceholder" placeholder="您的密码">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe" data-i18n="auth.rememberMe">记住我</label>
                            </div>
                            <button type="submit" class="btn sbx-cta-primary w-100"
                                data-i18n="auth.loginButton">登录</button>
                            <p class="text-center mt-3 mb-0">
                                <a href="#" class="text-secondary small" data-i18n="auth.forgotPassword">忘记密码？</a>
                            </p>
                        </form>

                        <hr class="my-4">

                        <!-- Sign Up Form -->
                        <form id="signupForm">
                            <h2 class="h5 fw-semibold mb-3" data-i18n="auth.signupTitle">注册</h2>
                            <div class="mb-3">
                                <label for="signupEmail" class="form-label" data-i18n="auth.emailLabel">邮箱地址</label>
                                <input type="email" class="form-control" id="signupEmail"
                                    data-i18n-placeholder="auth.emailPlaceholder" placeholder="您的邮箱">
                            </div>
                            <div class="mb-3">
                                <label for="signupPassword" class="form-label" data-i18n="auth.passwordLabel">密码</label>
                                <input type="password" class="form-control" id="signupPassword"
                                    data-i18n-placeholder="auth.passwordPlaceholder" placeholder="您的密码">
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label"
                                    data-i18n="auth.confirmPasswordLabel">确认密码</label>
                                <input type="password" class="form-control" id="confirmPassword"
                                    data-i18n-placeholder="auth.confirmPasswordPlaceholder" placeholder="再次输入密码">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="agreeTerms">
                                <label class="form-check-label" for="agreeTerms"
                                    data-i18n="auth.agreeTerms">我同意条款与条件</label>
                            </div>
                            <button type="submit" class="btn sbx-cta-outline w-100"
                                data-i18n="auth.signupButton">注册</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

                <div class="d-flex gap-3 small">

    <!-- Bootstrap JS (bundle includes Popper) -->

                'auth.loginTitle': '登录',
                'auth.emailLabel': '邮箱地址',
                'auth.emailPlaceholder': '您的邮箱',
                'auth.passwordLabel': '密码',

                'auth.rememberMe': '记住我',
                'auth.loginButton': '登录',
                'auth.forgotPassword': '忘记密码？',
                'auth.signupTitle': '注册',
                'auth.confirmPasswordLabel': '确认密码',
                'auth.confirmPasswordPlaceholder': '再次输入密码',
                'auth.agreeTerms': '我同意条款与条件',
                'auth.signupButton': '注册',
                'band.title': 'MAX享好礼 · 积星有礼',
                'band.text': '下单累积MAX豆，解锁会员等级，兑换专属好礼与优惠券。',
                'band.cta': '立即登录',
                'footer.about': '关于我们',
                'footer.about.story': '品牌故事',

                'footer.help': '帮助与支持',

                'footer.help.app': '下载 App',
                'footer.business': '商务合作',
                'footer.business.invest': '投资者关系',
                'footer.business.career': '人才招聘',
                'footer.business.franchise': '加盟合作',
                'footer.follow': '关注我们',
                'footer.follow.weibo': '微博',
                'footer.follow.wechat': '微信',

                'footer.bottom.contact': '联系我们',
                'footer.bottom.privacy': '隐私政策',
                'footer.bottom.terms': '使用条款'
            },
            en: {
                'nav.menu': 'Menu',
                'nav.collections': 'Collections',
                'nav.stores': 'Stores',
                'nav.brand': 'Brand',
                'nav.login': 'Sign In / Join',
                'nav.language': 'Language/语言',
                'auth.pageTitle': 'Login / Sign Up',
                'auth.loginTitle': 'Login',
                'auth.emailLabel': 'Email Address',
                'auth.emailPlaceholder': 'Your email',
                'auth.passwordLabel': 'Password',
                'auth.passwordPlaceholder': 'Your password',
                'auth.rememberMe': 'Remember me',
                'auth.loginButton': 'Login',

                'footer.bottom.contact': 'Contact us',
                'footer.bottom.privacy': 'Privacy policy',
                'footer.bottom.terms': 'Terms of use'
            }
        };

        function setLanguage(lang) {
            const dict = translations[lang] || translations.zh;
            // Update text content
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    el.textContent = dict[key];
                }
            });
            // Update placeholder attributes
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[key]) {
                    el.setAttribute('placeholder', dict[key]);
                }
            });
            localStorage.setItem('lang', lang);
            // Update the dropdown button text
            const langDropdown = document.getElementById('langDropdown');
            if (langDropdown) {
                langDropdown.textContent = lang === 'en' ? 'Language/语言' : '语言/EN';
            }
        }

        document.querySelectorAll('[data-lang]')?.forEach(function (btn) {
            btn.addEventListener('click', function () {
                const lang = this.getAttribute('data-lang');
                setLanguage(lang);
            });
        });

        // Initialize language on load
        setLanguage(localStorage.getItem('lang') || 'zh');
    </script>
