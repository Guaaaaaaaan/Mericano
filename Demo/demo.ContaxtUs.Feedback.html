<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merricano - 意见反馈 Feedback</title>
    <meta name="description"
        content="Feedback page for Merricano, allowing customers to provide suggestions and comments.">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Optional: site favicon -->
    <link rel="icon" type="image/png" href="Images/IconMerricano1.jpg">
    <style>
        :root {
            /* Primary */
            --brand-primary: #6B4226;
            /* Coffee Brown */
            /* Background */
            --bg-light-cream: #FAF3E7;
            --bg-dark-brown: #3E2723;
            /* Accents */
            --accent-caramel: #D4A373;
            --accent-olive: #7B8D42;
            /* Text */
            --text-main: #2C2C2C;
            --text-secondary: #5C5C5C;
            --text-inverse: #FFFFFF;
            /* Borders */
            --border-light: #E0D6CC;
            --border-dark: #8B5E3C;
        }

        /* Base */
        body {
            background-color: var(--bg-light-cream);
            color: var(--text-main);
        }

        .text-secondary {
            color: var(--text-secondary) !important;
        }

        .border-top {
            border-top-color: var(--border-light) !important;
        }

        .card {
            border-color: var(--border-light);
        }

        /* Navbar */
        .sbx-navbar {
            background-color: var(--brand-primary);
        }

        .sbx-navbar .nav-link,
        .sbx-navbar .navbar-brand {
            color: var(--text-inverse);
        }

        .sbx-navbar .nav-link.active,
        .sbx-navbar .nav-link:hover {
            color: var(--text-inverse);
            opacity: 0.9;
        }

        /* Hero */
        .sbx-hero {
            background-color: var(--bg-light-cream);
        }

        /* Buttons */
        .sbx-cta-primary {
            background-color: var(--brand-primary);
            color: var(--text-inverse);
            border-color: var(--brand-primary);
        }

        .sbx-cta-primary:hover {
            background-color: var(--accent-caramel);
            border-color: var(--accent-caramel);
            color: var(--text-main);
        }

        .sbx-cta-outline {
            color: var(--brand-primary);
            border-color: var(--brand-primary);
            background-color: transparent;
        }

        .sbx-cta-outline:hover {
            background-color: rgba(107, 66, 38, 0.08);
            color: var(--brand-primary);
        }

        /* Accent utilities */
        .text-accent-olive {
            color: var(--accent-olive);
        }

        .text-accent-caramel {
            color: var(--accent-caramel);
        }

        /* Band */
        .sbx-band {
            background-color: var(--bg-dark-brown);
            color: var(--text-inverse);
        }

        /* Footer */
        .sbx-footer {
            background-color: var(--bg-dark-brown);
            color: var(--text-inverse);
        }

        .sbx-footer a {
            color: var(--text-inverse);
            text-decoration: none;
            opacity: 0.9;
        }

        .sbx-footer a:hover {
            color: var(--text-inverse);
            opacity: 1;
        }

        /* Specific styles for this page */
        .feedback-form-card {
            background-color: #F3EFE9;
        }
    </style>
</head>

<body>
    <!-- Navbar (from index.html) -->
    <nav class="navbar navbar-expand-lg sbx-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="Images/IconMerricano.jpg" alt="Merricano" width="36" height="36" class="rounded-circle">
                <span class="fw-semibold">Merricano</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="Menu.html" data-i18n="nav.menu">菜单</a></li>
                    <li class="nav-item"><a class="nav-link" href="Collections.html" data-i18n="nav.collections">臻选</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="Countries.html" data-i18n="nav.stores">门店</a></li>
                    <li class="nav-item"><a class="nav-link" href="NewsRoom.html" data-i18n="nav.brand">品牌</a></li>
                    <li class="nav-item"><a class="nav-link" href="LogInSignUp.html" data-i18n="nav.login">登录/注册</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="langDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false" data-i18n="nav.language">语言/EN</a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="langDropdown">
                            <li><button class="dropdown-item" data-lang="zh">中文</button></li>
                            <li><button class="dropdown-item" data-lang="en">English</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="py-5 sbx-hero">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-3" data-i18n="feedback.title">意见反馈</h1>
            <p class="lead text-secondary" data-i18n="feedback.subtitle">我们非常重视您的宝贵意见。您的反馈将帮助我们不断改进，提供更优质的服务和产品。</p>
        </div>
    </section>

    <!-- Feedback Form Section -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card p-4 rounded-3 shadow-sm feedback-form-card">
                        <h4 class="h5 fw-bold mb-4" data-i18n="feedback.form.header">告诉我们您的想法</h4>
                        <form id="feedbackForm">
                            <div class="mb-3">
                                <label for="feedbackName" class="form-label"
                                    data-i18n="feedback.form.label.name">您的姓名</label>
                                <input type="text" class="form-control" id="feedbackName" required>
                            </div>
                            <div class="mb-3">
                                <label for="feedbackEmail" class="form-label"
                                    data-i18n="feedback.form.label.email">邮箱</label>
                                <input type="email" class="form-control" id="feedbackEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="feedbackType" class="form-label"
                                    data-i18n="feedback.form.label.type">反馈类型</label>
                                <select class="form-select" id="feedbackType" required>
                                    <option value="" data-i18n="feedback.form.type.select" disabled selected>请选择...
                                    </option>
                                    <option value="product" data-i18n="feedback.form.type.product">产品建议</option>
                                    <option value="service" data-i18n="feedback.form.type.service">门店服务</option>
                                    <option value="app" data-i18n="feedback.form.type.app">App/网站体验</option>
                                    <option value="other" data-i18n="feedback.form.type.other">其他</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="feedbackMessage" class="form-label"
                                    data-i18n="feedback.form.label.message">详细内容</label>
                                <textarea class="form-control" id="feedbackMessage" rows="6" required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn sbx-cta-primary btn-lg"
                                    data-i18n="feedback.form.submit">提交反馈</button>
                            </div>
                        </form>
                        <!-- Success Message -->
                        <div id="formSuccessMessage" class="alert alert-success text-center mt-4 d-none" role="alert"
                            data-i18n="feedback.form.success">
                            感谢您的宝贵意见！您的反馈已成功提交。
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer (multi-column links) -->
    <footer class="sbx-footer border-top pt-5 pb-4">
        <div class="container">
            <div class="row g-4">
                <div class="col-6 col-md-3">
                    <h6 class="fw-bold mb-3" data-i18n="footer.about">关于我们</h6>
                    <ul class="list-unstyled small">
                        <li class="mb-2"><a href="History.html" data-i18n="footer.about.story">品牌故事</a></li>
                        <li class="mb-2"><a href="NewsRoom.html" data-i18n="footer.about.news">新闻中心</a></li>
                        <li class="mb-2"><a href="JoinUs.html" data-i18n="footer.about.join">加入我们</a></li>
                    </ul>
                </div>
                <div class="col-6 col-md-3">
                    <h6 class="fw-bold mb-3" data-i18n="footer.help">帮助与支持</h6>
                    <ul class="list-unstyled small">
                        <li class="mb-2"><a href="ContextUs.CustomerService.html" data-i18n="footer.help.cs">客户服务</a>
                        </li>
                        <li class="mb-2"><a href="ContextUs.Feedback.html" data-i18n="footer.help.feedback">意见反馈</a>
                        </li>
                        <li class="mb-2"><a href="GetOurApp.html" data-i18n="footer.help.app">下载 App</a></li>
                    </ul>
                </div>
                <div class="col-6 col-md-3">
                    <h6 class="fw-bold mb-3" data-i18n="footer.business">商务合作</h6>
                    <ul class="list-unstyled small">
                        <li class="mb-2"><a href="JoinUs.Inverstor.html" data-i18n="footer.business.invest">投资者关系</a>
                        </li>
                        <li class="mb-2"><a href="JoinUs.Career.html" data-i18n="footer.business.career">人才招聘</a></li>
                        <li class="mb-2"><a href="JoinUs.Franchisees.html"
                                data-i18n="footer.business.franchise">加盟合作</a></li>
                    </ul>
                </div>
                <div class="col-6 col-md-3">
                    <h6 class="fw-bold mb-3" data-i18n="footer.follow">关注我们</h6>
                    <ul class="list-unstyled small">
                        <li class="mb-2"><a href="#" data-i18n="footer.follow.weibo">微博</a></li>
                        <li class="mb-2"><a href="#" data-i18n="footer.follow.wechat">微信</a></li>
                        <li class="mb-2"><a href="#" data-i18n="footer.follow.douyin">抖音</a></li>
                    </ul>
                </div>
            </div>
            <div class="d-flex flex-column flex-md-row align-items-center justify-content-between pt-4 mt-4 border-top">
                <span class="text-secondary small">© <span id="year"></span> Merricano Promax</span>
                <div class="d-flex gap-3 small">
                    <a href="ContextUs.html" data-i18n="footer.bottom.contact">联系我们</a>
                    <a href="#" data-i18n="footer.bottom.privacy">隐私政策</a>
                    <a href="#" data-i18n="footer.bottom.terms">使用条款</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS (bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Small helper script with i18n -->
    <script>
        const yearEl = document.getElementById('year');
        if (yearEl) {
            yearEl.textContent = new Date().getFullYear();
        }

        const translations = {
            zh: {
                // Nav
                'nav.menu': '菜单',
                'nav.collections': '臻选',
                'nav.stores': '门店',
                'nav.brand': '品牌',
                'nav.login': '登录/注册',
                'nav.language': '语言/EN',
                // Feedback Page Specific
                'feedback.title': '意见反馈',
                'feedback.subtitle': '我们非常重视您的宝贵意见。您的反馈将帮助我们不断改进，提供更优质的服务和产品。',
                'feedback.form.header': '告诉我们您的想法',
                'feedback.form.label.name': '您的姓名',
                'feedback.form.label.email': '邮箱',
                'feedback.form.label.type': '反馈类型',
                'feedback.form.type.select': '请选择...',
                'feedback.form.type.product': '产品建议',
                'feedback.form.type.service': '门店服务',

                'feedback.form.submit': '提交反馈',
                'feedback.form.success': '感谢您的宝贵意见！您的反馈已成功提交。',
                // Footer
                'footer.about': '关于我们',
                'footer.about.story': '品牌故事',
                'footer.about.news': '新闻中心',
                'footer.about.join': '加入我们',
                'footer.help': '帮助与支持',
                'footer.help.cs': '客户服务',
                'footer.help.feedback': '意见反馈',
                'footer.help.app': '下载 App',
                'footer.business': '商务合作',
                'footer.business.invest': '投资者关系',
                'footer.business.career': '人才招聘',
                'footer.business.franchise': '加盟合作',
                'footer.follow': '关注我们',
                'footer.follow.weibo': '微博',
                'footer.follow.wechat': '微信',
                'footer.follow.douyin': '抖音',
                'footer.bottom.contact': '联系我们',
                'footer.bottom.privacy': '隐私政策',
                'footer.bottom.terms': '使用条款'
            },
            en: {
                // Nav
                'nav.menu': 'Menu',
                'nav.collections': 'Collections',
                'nav.stores': 'Stores',
                'nav.brand': 'Brand',
                'nav.login': 'Sign In / Join',
                'nav.language': 'Language/语言',
                // Feedback Page Specific
                'feedback.title': 'Feedback',
                'feedback.subtitle': 'We highly value your opinion. Your feedback helps us to continuously improve our services and products.',
                'feedback.form.header': 'Tell Us What You Think',
                'feedback.form.label.name': 'Your Name',
                'feedback.form.label.email': 'Email',
                'feedback.form.label.type': 'Feedback Type',
                'feedback.form.type.select': 'Please select...',
                'feedback.form.type.product': 'Product Suggestion',
                'feedback.form.type.service': 'Store Service',
                'feedback.form.type.app': 'App/Website Experience',

                'feedback.form.label.message': 'Details',
                'feedback.form.submit': 'Submit Feedback',

                // Footer
                'footer.about': 'About us',
                'footer.about.story': 'Our story',
                'footer.about.news': 'Newsroom',
                'footer.about.join': 'Join us',
                'footer.help': 'Help & support',
                'footer.help.cs': 'Customer service',
                'footer.help.feedback': 'Feedback',
                'footer.help.app': 'Get the app',
                'footer.business': 'Business',
                'footer.business.invest': 'Investors',
                'footer.business.career': 'Careers',
                'footer.business.franchise': 'Franchise',
                'footer.follow': 'Follow us',
                'footer.follow.weibo': 'Weibo',
                'footer.follow.wechat': 'WeChat',
                'footer.follow.douyin': 'Douyin',
                'footer.bottom.contact': 'Contact us',
                'footer.bottom.privacy': 'Privacy policy',
                'footer.bottom.terms': 'Terms of use'
            }
        };

        function setLanguage(lang) {
            const dict = translations[lang] || translations.zh;
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    el.textContent = dict[key];
                }
            });
            localStorage.setItem('lang', lang);
        }

        document.querySelectorAll('[data-lang]')?.forEach(function (btn) {
            btn.addEventListener('click', function () {
                const lang = this.getAttribute('data-lang');
                setLanguage(lang);
            });
        });

        document.getElementById('feedbackForm').addEventListener('submit', function (event) {
            event.preventDefault();
            // In a real app, you would send this to a backend service.
            console.log('Feedback form submitted.');

            // Hide form and show success message
            this.style.display = 'none';
            document.getElementById('formSuccessMessage').classList.remove('d-none');
        });

        setLanguage(localStorage.getItem('lang') || 'zh');
    </script>
</body>

</html>
